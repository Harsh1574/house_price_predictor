<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>House Price Predictor</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">
</head>

<body>
    <div class="container">
        <div class="header">
            <div class="header-content">
                <h1>California House Price Predictor</h1>
                <p>Enter the details below to estimate the house price.</p>
            </div>
            <button id="theme-toggle" class="theme-toggle" aria-label="Toggle Dark Mode">
                🌙
            </button>
        </div>

        <div class="main-content">
            <form action="{{ url_for('predict') }}" method="post" class="prediction-form">

                <div class="form-group">
                    <label for="MedInc">Median Income (in $10k)</label>
                    <input type="number" step="0.01" name="MedInc" id="MedInc" placeholder="e.g. 5.2" required
                        value="{{ original_input['MedInc'] if original_input else '' }}">
                    <span class="tooltip">Median income in the block (tens of thousands)</span>
                </div>

                <div class="form-group">
                    <label for="HouseAge">House Age (Years)</label>
                    <input type="number" step="1" name="HouseAge" id="HouseAge" placeholder="e.g. 25" required
                        value="{{ original_input['HouseAge'] if original_input else '' }}">
                </div>

                <div class="form-group">
                    <label for="AveRooms">Average Rooms</label>
                    <input type="number" step="0.01" name="AveRooms" id="AveRooms" placeholder="e.g. 6.5" required
                        value="{{ original_input['AveRooms'] if original_input else '' }}">
                </div>

                <div class="form-group">
                    <label for="AveBedrms">Average Bedrooms</label>
                    <input type="number" step="0.01" name="AveBedrms" id="AveBedrms" placeholder="e.g. 1.2" required
                        value="{{ original_input['AveBedrms'] if original_input else '' }}">
                </div>

                <div class="form-group">
                    <label for="Population">Population</label>
                    <input type="number" step="1" name="Population" id="Population" placeholder="e.g. 800" required
                        value="{{ original_input['Population'] if original_input else '' }}">
                </div>

                <div class="form-group">
                    <label for="AveOccup">Average Occupancy</label>
                    <input type="number" step="0.01" name="AveOccup" id="AveOccup" placeholder="e.g. 3.5" required
                        value="{{ original_input['AveOccup'] if original_input else '' }}">
                </div>

                <div class="form-group">
                    <label for="Latitude">Latitude</label>
                    <input type="number" step="0.0001" name="Latitude" id="Latitude" placeholder="e.g. 37.88" required
                        value="{{ original_input['Latitude'] if original_input else '' }}">
                </div>

                <div class="form-group">
                    <label for="Longitude">Longitude</label>
                    <input type="number" step="0.0001" name="Longitude" id="Longitude" placeholder="e.g. -122.23"
                        required value="{{ original_input['Longitude'] if original_input else '' }}">
                </div>

                <button type="submit" class="btn-submit">Predict Price</button>
            </form>

            <div class="result-section">
                {% if prediction_text %}
                <div class="prediction-box success">
                    <h2>{{ prediction_text }}</h2>
                </div>

                <!-- Loan Calculator Dashboard -->
                <div class="loan-calculator" id="loan-calculator">
                    <h3>💰 Loan Calculator</h3>
                    <div class="calculator-grid">
                        <div class="form-group">
                            <label for="downPaymentPercent">Down Payment (%)</label>
                            <input type="number" id="downPaymentPercent" value="20" min="0" max="100"
                                oninput="calculateLoan()">
                        </div>
                        <div class="form-group">
                            <label for="interestRate">Interest Rate (%)</label>
                            <input type="number" id="interestRate" value="6.5" step="0.1" min="0"
                                oninput="calculateLoan()">
                        </div>
                        <div class="form-group">
                            <label for="loanTenure">Tenure (Years)</label>
                            <input type="number" id="loanTenure" value="20" min="1" max="30" oninput="calculateLoan()">
                        </div>
                    </div>

                    <div class="loan-results">
                        <div class="result-item">
                            <span>Down Payment</span>
                            <strong id="displayDownPayment">-</strong>
                        </div>
                        <div class="result-item">
                            <span>Loan Amount</span>
                            <strong id="displayLoanAmount">-</strong>
                        </div>
                        <div class="result-item highlight">
                            <span>Monthly EMI</span>
                            <strong id="displayEMI">-</strong>
                        </div>
                    </div>
                </div>
                {% endif %}

                {% if error %}
                <div class="prediction-box error">
                    <h2>{{ error }}</h2>
                </div>
                {% endif %}
            </div>
        </div>
    </div>

    <script>
        // Data from Flask
        const housePrice = parseFloat("{{ prediction_value if prediction_value else 0 }}");

        function calculateLoan() {
            if (!housePrice) return;

            const downPaymentPercent = parseFloat(document.getElementById('downPaymentPercent').value) || 0;
            const annualInterestRate = parseFloat(document.getElementById('interestRate').value) || 0;
            const tenureYears = parseFloat(document.getElementById('loanTenure').value) || 0;

            const downPayment = (downPaymentPercent / 100) * housePrice;
            const loanAmount = housePrice - downPayment;

            // EMI Calculation
            // E = P * r * (1+r)^n / ((1+r)^n - 1)
            const r = (annualInterestRate / 12) / 100; // monthly rate
            const n = tenureYears * 12; // months

            let emi = 0;
            if (r > 0 && n > 0) {
                emi = loanAmount * r * Math.pow(1 + r, n) / (Math.pow(1 + r, n) - 1);
            } else if (n > 0) {
                emi = loanAmount / n;
            }

            // Update UI
            document.getElementById('displayDownPayment').textContent = formatCurrency(downPayment);
            document.getElementById('displayLoanAmount').textContent = formatCurrency(loanAmount);
            document.getElementById('displayEMI').textContent = formatCurrency(emi);
        }

        function formatCurrency(num) {
            return '$' + num.toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
        }

        // Initialize calculator if price exists
        if (housePrice > 0) {
            calculateLoan();
        }

        const toggleButton = document.getElementById('theme-toggle');
        const body = document.body;

        // Check local storage for preference
        if (localStorage.getItem('theme') === 'dark') {
            body.classList.add('dark-mode');
            toggleButton.textContent = '☀️';
        }

        toggleButton.addEventListener('click', () => {
            body.classList.toggle('dark-mode');

            if (body.classList.contains('dark-mode')) {
                localStorage.setItem('theme', 'dark');
                toggleButton.textContent = '☀️';
            } else {
                localStorage.setItem('theme', 'light');
                toggleButton.textContent = '🌙';
            }
        });
    </script>
</body>

</html>
